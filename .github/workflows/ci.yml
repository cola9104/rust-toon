name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MINIO_IMAGE: minio/minio:RELEASE.2025-04-22T22-12-26Z
  MINIO_MC_IMAGE: minio/mc:RELEASE.2025-04-16T18-13-26Z

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  migrations:
    name: Empty database migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash script/test-database-migrations.sh

  ai-e2e:
    name: Mock AI provider E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash script/test-ai-e2e.sh

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web --filter @vben/web-antd run typecheck
      - run: pnpm --dir apps/web run test:unit
      - run: pnpm --dir apps/web --filter @vben/web-antd run build

  gateway-e2e:
    name: Gateway HTTP and WebSocket E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash script/test-gateway-e2e.sh

  production-e2e:
    name: Final video export and archive E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash script/test-production-e2e.sh

  distributed-jobs-e2e:
    name: JetStream and database lease failover E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install media worker dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash script/test-distributed-deployment.sh
      - run: bash script/test-distributed-jobs-e2e.sh

  object-backup-e2e:
    name: MinIO backup and restore E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash script/test-consistent-backup.sh
      - run: bash script/test-minio-backup.sh
