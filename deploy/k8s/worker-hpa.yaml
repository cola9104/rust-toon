apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rust-toon-worker
  labels:
    app.kubernetes.io/name: rust-toon-worker
    app.kubernetes.io/part-of: rust-toon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rust-toon-worker
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
