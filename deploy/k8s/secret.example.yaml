# Example only: this file is deliberately excluded from kustomization.yaml.
# Copy it outside the repository, replace every value, apply it, and then
# remove the plaintext copy. REPLACE_ME values intentionally fail closed.
apiVersion: v1
kind: Secret
metadata:
  name: rust-toon-gateway-secrets
  namespace: rust-toon
  labels:
    app.kubernetes.io/part-of: rust-toon
type: Opaque
stringData:
  # Percent-encode reserved characters in the database password.
  DATABASE_URL: "REPLACE_ME"
  # Use rediss:// when the managed Redis endpoint supports TLS.
  REDIS_URL: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  SECRET_ENCRYPTION_KEY: "REPLACE_ME"
  MINIO_ACCESS_KEY: "REPLACE_ME"
  MINIO_SECRET_KEY: "REPLACE_ME"
  # Bootstrap only: remove this key and re-apply the Secret after first login.
  BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: rust-toon-worker-secrets
  namespace: rust-toon
  labels:
    app.kubernetes.io/part-of: rust-toon
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  MINIO_ACCESS_KEY: "REPLACE_ME"
  MINIO_SECRET_KEY: "REPLACE_ME"
  # Use a credentialed tls:// URL, or mount NATS credentials in an overlay.
  NATS_URL: "REPLACE_ME"
