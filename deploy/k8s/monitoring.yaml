apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-toon-prometheus-config
  labels:
    app.kubernetes.io/name: rust-toon-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rust-toon
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        platform: rust-toon
    rule_files:
      - /etc/prometheus/rules/*.yaml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [rust-toon-alertmanager:9093]
    scrape_configs:
      - job_name: rust-toon-gateway
        metrics_path: /metrics
        static_configs:
          - targets: [rust-toon-gateway:8080]
      - job_name: rust-toon-worker
        metrics_path: /metrics
        dns_sd_configs:
          - names: [rust-toon-worker-metrics.rust-toon.svc.cluster.local]
            type: A
            port: 8081
            refresh_interval: 15s
      - job_name: rust-toon-otel-collector
        static_configs:
          - targets: [rust-toon-otel-collector:8888]
      - job_name: rust-toon-prometheus
        static_configs:
          - targets: [127.0.0.1:9090]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-toon-prometheus-rules
  labels:
    app.kubernetes.io/name: rust-toon-prometheus
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: rust-toon
data:
  rust-toon-alerts.yaml: |
    groups:
      - name: rust-toon.availability
        rules:
          - alert: RustToonGatewayDown
            expr: up{job="rust-toon-gateway"} != 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Rust Toon Gateway is unavailable
              description: Prometheus has been unable to scrape the Gateway for two minutes.
          - alert: RustToonWorkerFleetDown
            expr: sum(up{job="rust-toon-worker"}) < 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: No Rust Toon Worker is available
              description: Durable media and scheduled jobs cannot make progress.
          - alert: RustToonTelemetryCollectorDown
            expr: up{job="rust-toon-otel-collector"} != 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: OpenTelemetry Collector is unavailable
              description: Trace export is currently interrupted.
      - name: rust-toon.service-quality
        rules:
          - alert: RustToonHighHttp5xxRate
            expr: |
              sum(rate(rust_toon_http_requests_total{status=~"5.."}[5m]))
                / clamp_min(sum(rate(rust_toon_http_requests_total[5m])), 0.01) > 0.05
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: HTTP 5xx ratio is above 5%
              description: The aggregate five-minute server error ratio has stayed high for ten minutes.
          - alert: RustToonWorkerJobFailures
            expr: sum(increase(rust_toon_worker_jobs_total{outcome=~"failed|error"}[10m])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Durable Worker jobs are failing
              description: At least one durable job failed during the last ten minutes.
          - alert: RustToonStorageCleanupFailures
            expr: sum(increase(rust_toon_worker_storage_cleanup_total{outcome="failed"}[15m])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Object cleanup is failing
              description: Orphaned object cleanup failures were observed during the last fifteen minutes.
          - alert: RustToonLeaseRecoveryFailures
            expr: sum(increase(rust_toon_worker_lease_reaps_total{outcome="failed"}[15m])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Expired jobs could not be recovered
              description: At least one expired job lease reached a terminal failure.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rust-toon-prometheus
  labels:
    app.kubernetes.io/name: rust-toon-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: rust-toon
spec:
  serviceName: rust-toon-prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-toon-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-toon-prometheus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: rust-toon
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=18GB
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: rust-toon-prometheus-config
        - name: rules
          configMap:
            name: rust-toon-prometheus-rules
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rust-toon-prometheus
  labels:
    app.kubernetes.io/name: rust-toon-prometheus
    app.kubernetes.io/part-of: rust-toon
spec:
  selector:
    app.kubernetes.io/name: rust-toon-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-toon-alertmanager-config
  labels:
    app.kubernetes.io/name: rust-toon-alertmanager
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: rust-toon
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      # This safe default keeps alerts visible in Alertmanager without sending
      # them externally. Patch this receiver with a Secret-backed webhook,
      # email, PagerDuty, or another production destination.
      - name: default
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rust-toon-alertmanager
  labels:
    app.kubernetes.io/name: rust-toon-alertmanager
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: rust-toon
spec:
  serviceName: rust-toon-alertmanager
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-toon-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-toon-alertmanager
        app.kubernetes.io/component: alerting
        app.kubernetes.io/part-of: rust-toon
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: rust-toon-alertmanager-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rust-toon-alertmanager
  labels:
    app.kubernetes.io/name: rust-toon-alertmanager
    app.kubernetes.io/part-of: rust-toon
spec:
  selector:
    app.kubernetes.io/name: rust-toon-alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-toon-grafana-provisioning
  labels:
    app.kubernetes.io/name: rust-toon-grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: rust-toon
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://rust-toon-prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://rust-toon-loki:3100
        editable: false
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id":"([0-9a-f]{32})"'
              datasourceUid: tempo
              url: '$${__value.raw}'
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://rust-toon-tempo:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
          serviceMap:
            datasourceUid: prometheus
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Rust Toon
        orgId: 1
        folder: Rust Toon
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-toon-grafana-dashboard
  labels:
    app.kubernetes.io/name: rust-toon-grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: rust-toon
data:
  rust-toon-overview.json: |
    {
      "annotations":{"list":[]},
      "editable":false,
      "graphTooltip":1,
      "panels":[
        {"type":"stat","title":"Gateway Up","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max(up{job=\"rust-toon-gateway\"})","refId":"A"}],"gridPos":{"h":5,"w":6,"x":0,"y":0}},
        {"type":"stat","title":"Ready Workers","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(up{job=\"rust-toon-worker\"})","refId":"A"}],"gridPos":{"h":5,"w":6,"x":6,"y":0}},
        {"type":"stat","title":"HTTP 5xx / second","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rate(rust_toon_http_requests_total{status=~\"5..\"}[5m]))","refId":"A"}],"gridPos":{"h":5,"w":6,"x":12,"y":0}},
        {"type":"stat","title":"Jobs In Flight","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum(rust_toon_worker_jobs_inflight)","refId":"A"}],"gridPos":{"h":5,"w":6,"x":18,"y":0}},
        {"type":"timeseries","title":"HTTP Request Rate","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (service,status) (rate(rust_toon_http_requests_total[5m]))","legendFormat":"{{service}} {{status}}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":0,"y":5}},
        {"type":"timeseries","title":"HTTP p95 Latency","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.95, sum by (le,service) (rate(rust_toon_http_request_duration_seconds_bucket[5m])))","legendFormat":"{{service}}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":12,"y":5}},
        {"type":"timeseries","title":"Worker Job Outcomes","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (kind,outcome) (rate(rust_toon_worker_jobs_total[5m]))","legendFormat":"{{kind}} {{outcome}}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":0,"y":13}},
        {"type":"logs","title":"Application Logs","datasource":{"type":"loki","uid":"loki"},"targets":[{"expr":"{namespace=\"rust-toon\"}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":12,"y":13}}
      ],
      "refresh":"30s",
      "schemaVersion":41,
      "tags":["rust-toon"],
      "templating":{"list":[]},
      "time":{"from":"now-6h","to":"now"},
      "timezone":"browser",
      "title":"Rust Toon Overview",
      "uid":"rust-toon-overview",
      "version":1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-toon-grafana
  labels:
    app.kubernetes.io/name: rust-toon-grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: rust-toon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-toon-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-toon-grafana
        app.kubernetes.io/component: visualization
        app.kubernetes.io/part-of: rust-toon
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rust-toon-observability-secrets
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provisioning
          configMap:
            name: rust-toon-grafana-provisioning
        - name: dashboard
          configMap:
            name: rust-toon-grafana-dashboard
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rust-toon-grafana
  labels:
    app.kubernetes.io/name: rust-toon-grafana
    app.kubernetes.io/part-of: rust-toon
spec:
  selector:
    app.kubernetes.io/name: rust-toon-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
