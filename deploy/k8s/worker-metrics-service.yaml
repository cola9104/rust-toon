apiVersion: v1
kind: Service
metadata:
  name: rust-toon-worker-metrics
  labels:
    app.kubernetes.io/name: rust-toon-worker
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: rust-toon
spec:
  # A headless endpoint lets Prometheus scrape every Worker replica instead of
  # receiving a load-balanced sample from only one process.
  clusterIP: None
  selector:
    app.kubernetes.io/name: rust-toon-worker
  ports:
    - name: metrics
      port: 8081
      targetPort: management
      protocol: TCP
