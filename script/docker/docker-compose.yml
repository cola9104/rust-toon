services:
  postgres:
    image: postgres:18
    container_name: rust-toon-postgres
    environment:
      POSTGRES_USER: rust_toon
      POSTGRES_PASSWORD: rust_toon
      POSTGRES_DB: rust_toon
    ports:
      - "5432:5432"
    volumes:
      - rust-toon-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rust_toon -d rust_toon"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8
    container_name: rust-toon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  nats:
    image: nats:2
    container_name: rust-toon-nats
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - rust-toon-nats:/data
    healthcheck:
      # The official NATS image is distroless. Reopening the log asks the
      # running server to handle a signal and is therefore a process-aware
      # check without adding a shell to the image. JetStream itself is covered
      # by script/test-distributed-jobs-e2e.sh.
      test: ["CMD", "/nats-server", "--signal", "reopen=1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rnacos:
    image: qingpan/rnacos:v0.8.6
    container_name: rust-toon-rnacos
    environment:
      RNACOS_DATA_DIR: /io/nacos_db
      RNACOS_SDK_HOST: 0.0.0.0
      RNACOS_CONSOLE_HOST: 0.0.0.0
      RNACOS_ENABLE_OPEN_API_AUTH: "true"
      RNACOS_ENABLE_NO_AUTH_CONSOLE: "false"
      RNACOS_INIT_ADMIN_USERNAME: rust_toon
      RNACOS_INIT_ADMIN_PASSWORD: rust_toon_nacos_password
      RNACOS_BACKUP_TOKEN: rust_toon_local_backup_token_32_bytes
      RNACOS_GMT_OFFSET_HOURS: "8"
      RUST_LOG: warn
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:10848:10848"
    volumes:
      - rust-toon-rnacos:/io/nacos_db
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9848"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rust-toon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rust_toon
      MINIO_ROOT_PASSWORD: rust_toon_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rust-toon-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  rust-toon-postgres:
  rust-toon-nats:
  rust-toon-minio:
  rust-toon-rnacos:
